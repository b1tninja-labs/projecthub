name: Set up the Project

# Creates or repairs the fields and views on the organization Project, with the GitHub App's token. Run by hand.
# The key lives in the github-app environment, which only main can deploy to; `projecthub app create` puts it there.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    environment: github-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.PROJECTHUB_APP_ID }}
          private-key: ${{ secrets.PROJECTHUB_APP_PRIVATE_KEY }}
          owner: b1tninja-labs
      - run: python -m pip install --quiet .
      - run: projecthub board --schema-only --apply
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
