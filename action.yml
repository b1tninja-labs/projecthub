name: roadmap gate
description: >-
  Check a project's ROADMAP.md against the callables its rows name, and against the GitHub issues
  derived from it. Read-only: this action never creates, comments, closes or pushes.

# Consumed as `uses: b1tninja/sdk-forge@main`. The consuming workflow is expected to have already
# checked its own project out; FORGE_ROOT is pointed at the parent of that checkout so the project
# name resolves to a directory. Rows and issues are matched on a marker in each issue body, so a
# re-run is a no-op rather than a duplicate.

inputs:
  project:
    description: Project name. Defaults to the repository name.
    required: false
    default: ""
  token:
    description: Token used to read this repository's issues.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - run: python -m pip install --quiet '${{ github.action_path }}[dev]'
      shell: bash

    - name: Roadmap rows must name real callables
      working-directory: ${{ github.workspace }}
      run: |
        set -eu
        if [ -f tests/test_roadmap_rows.py ]; then
          python -m pytest -q tests/test_roadmap_rows.py
        else
          # Loud, not silent: a gate that skips reads as green, and a green gate nobody can
          # distinguish from an absent one is not a gate.
          echo "::warning::no tests/test_roadmap_rows.py in this project; matrix rows are unenforced"
        fi
      shell: bash

    - name: Roadmap and issues must agree
      env:
        GH_TOKEN: ${{ inputs.token }}
        FORGE_PROJECT: ${{ inputs.project }}
      run: |
        set -eu
        project="${FORGE_PROJECT:-$(basename "$GITHUB_WORKSPACE")}"
        # --root expects <root>/<project>/ROADMAP.md. The runner's layout is a convention, not a
        # contract, so the shape is built rather than inferred from the checkout path.
        root=$(mktemp -d)
        mkdir -p "$root/$project"
        cp ROADMAP.md "$root/$project/"
        projecthub sync --check --project "$project" --root "$root" \
          --org "${GITHUB_REPOSITORY_OWNER}"
      shell: bash
